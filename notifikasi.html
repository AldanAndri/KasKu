<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi • KasKu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#111827;padding-bottom:50px}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-bottom:1px solid #e8edf3;}
.header-inner{max-width:700px;height:70px;margin:auto;padding:0 17px;display:flex;align-items:center;gap:13px;}
.back{width:42px;height:42px;border:0;border-radius:14px;background:#f0f3f7;font-size:24px;cursor:pointer;}
.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#1677ff,#4facff);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:17px;}
.title h1{font-size:18px;font-weight:800}
.title p{color:#8792a2;font-size:10px;margin-top:3px}
.container{max-width:700px;margin:auto;padding:20px 15px;}
.hero{background:linear-gradient(135deg,#0b1220,#172b48);border-radius:25px;padding:23px;color:white;margin-bottom:15px;box-shadow:0 15px 35px rgba(11,18,32,.14);}
.hero h2{font-size:18px;margin-top:8px}
.hero p{color:#b9c4d3;font-size:11px;margin-top:5px;line-height:1.4}
.filter{display:flex;gap:8px;overflow-x:auto;padding:10px 0 15px;scrollbar-width:none;}
.filter button{border:1px solid #e3e8ef;background:white;color:#687385;border-radius:11px;padding:9px 13px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;}
.filter button.active{color:white;background:#111827;border-color:#111827;}
.card{background:white;border:1px solid #e8edf3;border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px rgba(15,23,42,.035);}
.card h4{font-size:13px;font-weight:800;margin-bottom:4px;}
.date{color:#9aa4b2;font-size:9px;margin-bottom:8px;}
.info p{color:#6f7b8b;font-size:11px;line-height:1.5;}
.banner{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;}
.category{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:6px;font-size:8px;font-weight:800;background:#eaf3ff;color:#1266ce;}
</style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <button class="back" onclick="window.location.href='index.html'">‹</button>
        <div class="logo">K</div>
        <div class="title">
            <h1>Notifikasi</h1>
            <p>Pusat informasi KasKu</p>
        </div>
    </div>
</header>

<main class="container">
    <section class="hero">
        <div style="font-size:22px;">🔔</div>
        <h2>Pusat Informasi KasKu</h2>
        <p>Dapatkan surat edaran, pengumuman, dan pemberitahuan terbaru.</p>
    </section>

    <div class="filter" id="filterContainer">
        <button class="active" data-filter="Semua">Semua</button>
        <button data-filter="Surat Edaran">📢 Surat Edaran</button>
        <button data-filter="Pemberitahuan">🔔 Pemberitahuan</button>
        <button data-filter="Update Sistem">🆕 Update Sistem</button>
        <button data-filter="Penting">⚠️ Penting</button>
        <button data-filter="Iklan">📣 Iklan</button>
    </div>

    <div id="notificationList">
        <div style="text-align:center; padding:30px; font-size:12px; color:#8792a2;">Memuat notifikasi...</div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBVVsQxGULQNJAD-29rRA_2pVyU3wgzfeQ",
    authDomain: "kasku-1ad13.firebaseapp.com",
    projectId: "kasku-1ad13",
    storageBucket: "kasku-1ad13.firebasestorage.app",
    messagingSenderId: "776446739854",
    appId: "1:776446739854:web:b822b255c73623644290df"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allNotifications = [];
let currentFilter = "Semua";

db.collection("notifikasi").orderBy("waktu", "desc").onSnapshot(snapshot => {
    allNotifications = [];
    snapshot.forEach(doc => allNotifications.push(doc.data()));
    renderNotifications();
});

document.querySelectorAll(".filter button").forEach(btn => {
    btn.onclick = function() {
        document.querySelectorAll(".filter button").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentFilter = this.getAttribute("data-filter");
        renderNotifications();
    };
});

function renderNotifications() {
    const listContainer = document.getElementById("notificationList");
    let filtered = currentFilter === "Semua" ? allNotifications : allNotifications.filter(n => n.kategori === currentFilter);

    if (filtered.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#8792a2; font-size:11px;">Belum ada informasi pada kategori ini.</div>`;
        return;
    }

    let html = "";
    filtered.forEach(data => {
        let imgTag = data.gambar ? `<img src="${data.gambar}" class="banner">` : "";
        let tgl = data.waktu ? new Date(data.waktu.toDate()).toLocaleDateString("id-ID", {day: 'numeric', month: 'long', year: 'numeric'}) : "Baru saja";
        
        html += `
        <article class="card">
            <h4>${data.judul}</h4>
            <div class="date">${tgl} • ${data.pengirim || 'Admin'}</div>
            <p>${data.pesan}</p>
            <span class="category">${data.kategori}</span>
            ${imgTag}
        </article>`;
    });
    listContainer.innerHTML = html;
}
</script>
</body>
</html>
