<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#24344a;--muted:#8994a5;--primary:#087cff;--border:#e5eaf0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
.app{max-width:480px;margin:auto}
.header{height:215px;padding:20px;color:#fff;background:linear-gradient(135deg,#1554cf,#087fe9,#10b9dc);border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.header:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#ffffff14;right:-90px;top:-100px}
.header:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#ffffff10;left:-70px;bottom:-80px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.title{font-size:23px;font-weight:900}.sub{font-size:9px;opacity:.8;margin-top:4px}
.mode{border:0;background:#ffffff20;color:white;border-radius:12px;width:38px;height:38px;font-size:16px}
.clock{font-size:8px;background:#ffffff20;width:max-content;padding:7px 10px;border-radius:8px;margin-top:22px}
.today{position:absolute;left:20px;right:20px;bottom:17px;background:white;color:var(--text);padding:12px 14px;border-radius:17px;box-shadow:0 8px 25px #15508a35;z-index:2}
.today small{font-size:7px;color:var(--muted)}.today b{display:block;margin-top:4px;font-size:14px}
.content{padding:17px 15px}.section{font-size:11px;font-weight:900;margin-bottom:10px;color:#687487}
.day{margin-bottom:18px}.daytitle{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}.daytitle b{font-size:15px}.daytitle span{font-size:7px;color:var(--muted)}
.card{background:var(--card);border-radius:17px;padding:13px;display:flex;gap:10px;margin-bottom:8px;box-shadow:0 4px 18px #1d456c0d;cursor:pointer;transition:.2s}
.card:active{transform:scale(.98)}
.bar{width:4px;flex-shrink:0;border-radius:10px;background:linear-gradient(#087cff,#18b8df)}
.info{flex:1}.time{font-size:7px;color:var(--muted);margin-bottom:5px}.subject{font-size:11px;font-weight:900}.desc{font-size:7px;color:var(--muted);margin-top:5px;line-height:1.4}.arrow{align-self:center;color:#a9b1bc;font-size:20px}
.badge{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:6px;background:#eaf4ff;color:#087cff;font-size:6px;font-weight:bold}
.jp{background:linear-gradient(105deg,#fff,#fff5f5);border:1px solid #f1dede}.jp .bar{background:linear-gradient(#e32929 0 34%,#fff 34% 67%,#e32929 67%)}.jp .badge{background:#ffe9e9;color:#d52d2d}
.empty{background:var(--card);border-radius:15px;padding:20px;text-align:center;color:var(--muted);font-size:8px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;align-items:flex-end}.modal.show{display:flex}
.sheet{width:min(480px,100%);max-height:89vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:18px 16px 35px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.close{float:right;border:0;background:#edf1f5;width:31px;height:31px;border-radius:50%;font-size:19px}
.sheet h2{font-size:18px;margin:5px 40px 3px 0}.sheet>small{font-size:8px;color:var(--muted)}
.intro{margin-top:15px;background:#f0f6ff;padding:11px;border-radius:12px;font-size:8px;line-height:1.6;color:#627086}
.japanintro{background:#fff1f1}
.topic{font-size:10px;font-weight:900;margin-top:15px}.material{background:#f7f8fa;padding:10px;border-radius:10px;margin-top:6px;font-size:8px;line-height:1.65;color:#59677a}
nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid var(--border);z-index:97}
nav a{color:var(--muted);text-decoration:none;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px}nav a.active{color:var(--primary);font-weight:bold}nav i{font-size:15px}
.dark{--bg:#101722;--card:#192331;--text:#edf3fa;--muted:#9ba9ba;--border:#2b3746}.dark .today{color:#fff}.dark .card,.dark .empty{background:#192331}.dark .sheet{background:#192331}.dark .material{background:#202c3b}.dark .intro{background:#202e40}.dark .jp{background:#30252a}
</style>
</head>

let data=JSON.parse(localStorage.getItem("jadwal_mapel")||"null")||defaultData;
const days=["Senin","Selasa","Rabu","Kamis","Jumat"];

function render(){
let html="";
days.forEach(day=>{
let arr=data[day]||[];
html+=`<section class="day"><div class="daytitle"><b>📅 ${day}</b><span>${arr.length} MAPEL</span></div>`;
if(!arr.length)html+=`<div class="empty">Belum ada jadwal.</div>`;
else arr.forEach((x,i)=>{
html+=`<div class="card ${x.jp?"jp":""}" onclick="openDetail('${day}',${i})">
<div class="bar"></div><div class="info">
<div class="time">🕐 ${x.jam}</div>
<div class="subject">${x.jp?"🇯🇵 ":""}${x.mapel}</div>
<div class="desc">${x.jp?"Materi Jepang & budaya":"Materi pembelajaran wajib"}</div>
<span class="badge">${x.jp?"JEPANG":"MATERI"}</span>
</div><div class="arrow">›</div></div>`;
});
html+=`</section>`;
});
schedule.innerHTML=html;
}

function openDetail(day,i){
let x=data[day][i];
mTitle.textContent=(x.jp?"🇯🇵 ":"📚 ")+x.mapel;
mTime.textContent="🕐 "+x.jam+" • "+day;
mBody.innerHTML=`<div class="intro ${x.jp?"japanintro":""}"><b>📖 MATERI WAJIB DIPELAJARI</b><br>Tekan kembali untuk melihat jadwal lainnya.</div>`+
x.materi.map((m,i)=>`<div class="topic">${i+1}. ${m[0]}</div><div class="material">${m[1]}</div>`).join("");
modal.classList.add("show");
}

function closeModal(){modal.classList.remove("show")}
modal.onclick=e=>{if(e.target===modal)closeModal()};

function updateClock(){
let d=new Date();
clock.textContent="🕐 "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+" WIB • "+d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
let n=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][d.getDay()];
let arr=data[n]||[];
today.textContent=n+(arr.length?" • "+arr.map(x=>x.mapel).join(" • "):" • Tidak ada jadwal");
}

function darkMode(){
document.body.classList.toggle("dark");
localStorage.setItem("jadwal_dark",document.body.classList.contains("dark")?"1":"0");
}

if(localStorage.getItem("jadwal_dark")==="1")document.body.classList.add("dark");
render();updateClock();setInterval(updateClock,1000);

window.addEventListener("storage",()=>{
data=JSON.parse(localStorage.getItem("jadwal_mapel")||"null")||defaultData;
render();updateClock();
});
</script>
